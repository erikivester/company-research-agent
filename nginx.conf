events {
    worker_connections 1024;
}

http {
    # API Server (FastAPI on port 8000)
    upstream api_backend {
        server 127.0.0.1:8000;
    }

    # Airtable Extension (block run on port 9002)
    upstream extension_backend {
        server 127.0.0.1:9002;
    }

    server {
        listen 8080;
        server_name localhost;

        # Increase client body size for file uploads
        client_max_body_size 100M;

        # API routes - anything starting with /api, /templates, /generate-email, /ws, /research
        location ~ ^/(api|templates|generate-email|ws|research|companies|docs|health|metrics|airtable-debug) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket settings
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Airtable Extension routes - everything else goes to the extension
        location / {
            proxy_pass https://extension_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSL verification (block run uses HTTPS)
            proxy_ssl_verify off;
        }
    }
}
